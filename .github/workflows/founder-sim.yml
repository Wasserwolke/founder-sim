name: Founder Sim - Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: founder-sim-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Founder Sim
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Install Python tooling
        run: python -m pip install -r requirements.txt

      - name: Validate Python scripts
        run: python -m compileall -q scripts

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            python -m json.tool "$file" >/dev/null
          done < <(find app/web asset_sources -type f -name '*.json' -print0)

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find app/web/js app/web/mods -type f -name '*.js' -print0)

      - name: Validate asset and catalog links
        run: python scripts/asset_status.py

      - name: Smoke test web app
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8080 --directory app/web >/tmp/founder-sim-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2
          curl --fail --silent --show-error http://127.0.0.1:8080/ >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/assets/manifest.json >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:8080/locales/de.json >/dev/null

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Founder Sim site
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/web

      - name: Deploy Founder Sim
        id: deployment
        uses: actions/deploy-pages@v4
