name: Founder Sim - Test and Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: founder-sim-pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate Founder Sim
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip

      - name: Write change summary
        if: always()
        run: python scripts/change_report.py --github-summary

      - name: Install Python tooling
        run: python -m pip install -r requirements.txt

      - name: Validate Python scripts
        run: python -m compileall -q scripts

      - name: Validate JSON files
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            python -m json.tool "$file" >/dev/null
          done < <(find app/web asset_sources -type f -name '*.json' -print0)

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find app/web/js app/web/mods -type f -name '*.js' -print0)

      - name: Validate web DOM contract
        shell: bash
        run: |
          set -euo pipefail
          html="app/web/index.html"
          for id in scene environment objectLayer backButton toast rainFx darknessFx; do
            grep -q "id=\"$id\"" "$html" || {
              echo "::error::Required DOM node #$id is missing from $html"
              exit 1
            }
          done
          grep -q '<img id="environment"' "$html" || {
            echo "::error::#environment must be an img element so object coordinates can follow its rendered rectangle"
            exit 1
          }
          grep -q 'class="hud-stat"' "$html" || {
            echo "::error::HUD markup does not match the current stylesheet contract"
            exit 1
          }
          for legacy_id in deskHotspots mapHotspots hotspotLayer; do
            if grep -q "id=\"$legacy_id\"" "$html"; then
              echo "::error::Legacy DOM node #$legacy_id must not be present"
              exit 1
            fi
          done

      - name: Validate runtime graph and assets
        run: python scripts/asset_status.py

      - name: Smoke test web app and visible base assets
        shell: bash
        run: |
          set -euo pipefail
          python -m http.server 8080 --directory app/web >/tmp/founder-sim-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          sleep 2

          for path in \
            / \
            /assets/manifest.json \
            /locales/de.json \
            /data/objects.json \
            /data/scenes.json \
            /assets/environments/desk_room_starter/desk_room_starter_night_base.png \
            /assets/environments/storage_room_starter/storage_room_starter_base.png \
            /assets/map/city_map_starter/city_map_starter_base.png \
            /assets/atlases/prototype_atlas_001.png; do
            curl --fail --silent --show-error "http://127.0.0.1:8080$path" >/tmp/founder-sim-smoke.bin
            test -s /tmp/founder-sim-smoke.bin || {
              echo "::error::Smoke-test response is empty: $path"
              exit 1
            }
          done

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Founder Sim site
        uses: actions/upload-pages-artifact@v4
        with:
          path: app/web

      - name: Deploy Founder Sim
        id: deployment
        uses: actions/deploy-pages@v4
